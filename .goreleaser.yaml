# Release do atlana com GoReleaser v2 (https://goreleaser.com).
# Teste local, sem publicar: goreleaser release --snapshot --clean
version: 2

project_name: atlana

before:
  hooks:
    - go mod tidy
    - go test ./...
    - go run ./cmd/atlana validate packs
    - go run ./cmd/atlana validate templates

builds:
  - id: atlana
    main: ./cmd/atlana
    binary: atlana
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/atlana-ai-hq/atlana/internal/cli.Version={{ .Version }}

archives:
  - id: atlana
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# macOS: assina e notariza só quando os secrets da Apple existem (ver
# docs/release.md). Sem eles, o release sai sem assinatura e o Gatekeeper
# bloqueia o binário baixado no macOS: não contorne removendo a quarentena.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true

# Cask no tap atlana-ai-hq/homebrew-tap. Só publica quando o token existe
# (HOMEBREW_TAP_GITHUB_TOKEN no CI); o token nunca fica neste arquivo.
homebrew_casks:
  - name: atlana
    repository:
      owner: atlana-ai-hq
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/atlana-ai-hq/atlana
    description: Um formato, todos os agentes. Instala skills, rules, MCP, subagents e hooks em agentes de IA.
    license: MIT
    binaries: [atlana]
